[project]
name = "cdisc-concept-curation"
version = "0.4.0"
description = "Flask web application for curating CDISC Biomedical Concepts (BCs)"
requires-python = ">=3.11"

[tool.black]
line-length = 200
target-version = ['py311', 'py312']
extend-exclude = "cdisc-bc-ncit-alignment/"

[tool.isort]
profile = "black"
line_length = 200
skip = ["cdisc-bc-ncit-alignment"]

[tool.pytest.ini_options]
addopts = "--ignore=cdisc-bc-ncit-alignment"
